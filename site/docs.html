const CONTENT = {"README.md": "# night-shift\n\n夜班持续工作系统的记忆仓库。运行协议见 [AGENTS.md](AGENTS.md)。\n\n## 目录结构\n\n| 路径 | 用途 |\n| --- | --- |\n| `memory/long-term-memory.md` | 长期记忆：长期约束、重要决策、待人工确认事项 |\n| `memory/project-status.md` | 项目状态：待办、已完成事项 |\n| `logs/` | 按日期的夜班工作日志（`YYYY-MM-DD.md`） |\n| `handoff/` | 班次交接记录（A/B/C/D） |\n| `tools/` | 夜班自动化工具 |\n| `tests/` | 工具的单元测试 |\n\n## 工具\n\n### `tools/shift_report.py` — 交班记录生成器\n\n自动采集本班次的 git 活动（提交、改动文件、行数、未提交状态），按协议固定\n章节生成交班记录 Markdown，默认写入 `handoff/`。判断类章节（今晚发现、\n今晚比赛、冠军方案、今晚发明、未完成问题、最有价值成果、下一步、\n下一轮建议、建议A/B/C/D）留为 TODO，由人或 AI 补全。\n\n```bash\npython tools/shift_report.py --title \"夜班C\"            # 覆盖最近一次 23:05 起（夜班窗口起点）\npython tools/shift_report.py --hours 8 --title \"夜班C\"  # 覆盖最近 8 小时\npython tools/shift_report.py --test \"python -m unittest discover -s tests\"  # 自动跑测试并写入记录\npython tools/shift_report.py --stdout                    # 只打印不写文件\npython tools/shift_report.py --append --title \"夜班C\"    # 追加进持续交接文档\n```\n\n- `--since \"20:30\"` 取该时刻**最近一次出现**：夜班跨午夜（23:05–08:05），早上生成记录时写 `\"23:05\"` 指昨夜的 23:05；`--out` 只接受仓库内相对路径（默认 `handoff`）。\n- `--append` 把本次记录作为最新章节插入 `handoff/night-shift-<x>-handoff.md`（按 `--title` 中的班次字母推导，也可显式给相对路径），与夜班A确立的\"单文件持续更新\"交班约定一致；不加 `--append` 则新建按日期的独立文件。\n- `--shift-tag C` 只统计提交信息以 `[C]` 开头的提交（班次归属过滤，约定落地后即用即生效；提交不带标记时结果为空）。\n- `--profile C` 按预置的班次协议章节渲染（默认是各班次协议的并集）；`--sections \"a,b\"` 可显式指定章节。其他班次拿到权威模板后在 `tools/shift_report.py` 的 `PROFILES` 登记。\n- 同一时段重复生成不覆盖旧记录，追加序号。\n- 仅依赖 Python 3 标准库和 git。\n\n### `tools/shift_start.py` — 开夜班自检\n\n夜班系统有多名班次并发操作同一个仓库（2026-09-11 夜间实际发生过文件踩踏）。\n开工时先运行，回答两个问题：仓库现在什么状态？是否有并行班次正在工作？\n\n```bash\npython tools/shift_start.py                  # 只读，不改任何文件\npython tools/shift_start.py --warn-minutes 30\n```\n\n最后提交距今不足阈值（默认 15 分钟）或工作区不干净时会给出并发警告；\n同时显示与远程的领先/落后提交数，本地领先时提醒 CI 尚未运行。\n\n### `tools/memory_check.py` — 记忆体检\n\n自动化「持续检查记忆文件的重复/冲突/过期信息」的常设任务（只读）。职责归属：由夜班A在记忆维护时执行（CI 亦自动运行）：\n\n- 校验 `memory/`、`handoff/`、`logs/` 中引用的提交哈希真实存在；\n- 汇总全部【待确认】事项的位置，供下一班次向人工一次性提问；\n- 发现未来日期的时间戳。\n\n```bash\npython tools/memory_check.py                 # 有问题 exit 1，可接 CI\n```\n\n约定：【待确认】只用于标记真实待确认事项；描述性文字写「待确认」，\n避免体检误报。建议的收尾组合命令（交班记录自动带上测试与体检结果）：\n\n```bash\npython tools/shift_report.py --append --profile C --title \"夜班C\" --test   \"python -m unittest discover -s tests && python tools/memory_check.py\"\n```\n\n### `tools/morning_report.py` — 晨报（夜班→人类交付）\n\n夜班系统的最后一环：早上醒来的人一条命令看懂昨夜。聚合一个夜班窗口的\n全部提交（按 `[A]/[B]/[C]/[D]` 标记自动归属到班次）、代码量统计、现场\n运行的测试与记忆体检结果，以及跨文件汇总的**待人工确认清单**——这是\n晨报的核心：人对夜班系统唯一需要做的事就在这一节。\n\n```bash\npython tools/morning_report.py          # 默认覆盖最近一次 23:05 起，写入 handoff/\npython tools/morning_report.py --stdout # 只打印\n```\n\n### `tools/night_web.py` — 夜班驾驶舱（HTML+JS，GitHub Pages 可用）\n\n把整个夜班系统渲染成一页可视化面板：健康度卡片（测试/记忆体检/待确认/\n远程同步/代码量）、按班次分泳道的提交时间轴（可筛选、悬停看详情）、\n班次贡献统计、待人工确认清单、最新交接文档与日志入口。\n\nPython 只负责采集数据（内嵌为 `const DATA`），渲染与交互全部由浏览器端\nJS 完成；只用相对路径，单文件自包含——本地双击可开，推到 GitHub Pages\n（Settings → Pages → 选择 `site/` 目录）即成为团队面板。\n\n```bash\npython tools/night_web.py              # 生成 site/index.html\npython tools/night_web.py --serve      # 本地 http://127.0.0.1:8800 预览\n```\n\n### `tools/night_docs.py` — 夜班图书馆（HTML+JS 文档聚合阅读器）\n\n把 memory/、handoff/、logs/ 的全部 Markdown（含 README）聚合成一个\n可浏览、可搜索的静态页面：侧栏按目录分组导航、标题过滤、内置迷你\nMarkdown 渲染器（标题/列表/围栏代码/引用/表格/行内样式，先转义再渲染，\n无注入面）。Python 生成 site/docs.html + docs-manifest.json；正文随页面\n内嵌在页面里，Pages 选 `site/` 目录（或 `--serve`、直接双击 file://）都能读。\n\n```bash\npython tools/night_docs.py --serve    # http://127.0.0.1:8801/site/docs.html\n```\n\n### `tools/night_history.py` — 夜班大事记（全历史编年史页）\n\n按日聚合全部提交：各班次每日提交热力表 + 编年史（每日可展开明细）。\n驾驶舱看一个窗口，本页看积累——值班天数越多越有价值。\n\n```bash\npython tools/night_history.py            # 生成 site/history.html\npython tools/night_history.py --days 30  # 只看最近 30 天\n```\n\nsite/ 三个页面互链：`index.html` 驾驶舱 · `docs.html` 图书馆 ·\n`history.html` 大事记。GitHub Pages 选择 `site/` 目录即可全部上线。\n\n### `tools/night_shifts.py` / `tools/night_sky.py` — 出勤表与提交星图\n\n- **出勤表** `site/shifts.html`：从提交时间聚类反推各班次值班时段（间隔\n  ≤2h 同段），按日甘特图（0–24 时横轴）+ 累计在岗时长与提交密度。\n- **提交星图** `site/sky.html`：每次提交是一颗星（x=时间，y=哈希决定，\n  颜色=班次），同班次连成星座线，星星闪烁、偶有流星，悬停看详情。\n\n```bash\npython tools/night_shifts.py --days 14   # 出勤表\npython tools/night_sky.py                # 星图（全部历史）\n```\n\n### `site/game.html` — 夜班模拟器（文字冒险游戏）\n\n改编自首夜真实事件的文字冒险：你扮演一个夜班 AI，面对并发班次突袭、\nREADME 冲突、越界写入、误提交 pyc、管道吞退出码……每个分支都真的\n发生过，包括坏结局。纯 HTML+JS，双击即玩。\n\nsite/ 全家族（Pages 选 `site/` 目录）：`index.html` 驾驶舱 ·\n`docs.html` 图书馆 · `history.html` 大事记 · `shifts.html` 出勤表 ·\n`sky.html` 星图 · `game.html` 模拟器。\n\n## 使用约定\n\n- 只记录具有长期价值的信息，不凭空创造事实；不确定的内容标注【待确认】。\n- 每次夜班结束前：更新项目状态、写当日日志、更新交班记录、确认 Git 状态。\n- 不在没有必要的情况下制造 Commit。\n\n## 测试\n\n```bash\npython -m unittest discover -s tests\n```\n\n测试在临时目录创建真实 git 仓库验证采集逻辑，不触碰本仓库状态。\n", "memory/long-term-memory.md": "# 长期记忆\n\n> 本文件只收录具有长期价值的信息：长期约束、重要决策、系统事实。\n> 普通工作日志不进入此文件（日志放 `logs/`）。\n> 记录格式：每条带日期与来源；无法确认的信息必须标注【待确认】。\n\n---\n\n## 一、系统事实\n\n- [2026-09-11] 夜班系统首次启动。本仓库（`night-shift`）是夜班系统的唯一工作根目录，初始 commit 仅含一行 README，在此之前不存在任何记忆文件、日志或交接文件。\n- [2026-09-11] 夜班分为 A/B/C/D 四个班次/角色，通过交接文件交接。[2026-09-12，人工确认] 各班次职责定案：**A=记忆基建（含记忆检查）**、**B=方案竞争（棋手联赛）**、**C=无聊发明（工具创造）**、D=记录。另有**出版署**班次负责 push（见重要决策）。佐证：`tools/shift_report.py` 章节模板为各班次协议的并集；首夜实践与上述一致。\n- [2026-09-11, 更正于 23:35，夜班C] `tools/shift_report.py` 并非用户放入，而是夜班C在 23:23 后创建（夜班A先前\"作者疑似用户\"的判断不成立）。已由夜班C入库（commit `a80df5b`，含 15 项单元测试与 README 文档）；默认输出目录已改为 `handoff/`（对齐夜班A的目录约定，命名冲突在工具侧解决）；模板已补齐「建议C关注」章节。\n- [2026-09-11, 夜班B] 本夜并发活跃度极高：夜班A/C/夜班B 同窗口工作，用户本人也在直接提交（`a80df5b`、`20241b3`）。后续班次开工前必须重新 `git status`/`git log` 并重读记忆文件，编辑共享文件前必须重新读取最新版本，提交时只 `git add` 自己的文件。\n- [2026-09-11, 夜班B] `tools/shift_report.py` 章节已与 AGENTS.md 夜班B交班字段对齐（commit `359b47d`，新增\"今晚比赛/冠军方案/未完成问题/下一轮建议\"），并新增 `PROTOCOL_REQUIRED_SECTIONS` 常量由测试防止章节与协议再漂移；跨午夜 `--since` 负窗口 bug 已修复（`befa1a5`、`427013b`，语义统一为\"取该时刻最近一次出现\"）；CI 已建立（`16e4535`，push/PR 自动跑测试）。测试 19 项。\n- [2026-09-11, 夜班B第二次值班] 工具健壮性加固：评审发现并修复 10 项真实缺陷（参数校验、`--warn-minutes` 判定失效、`--append` 围栏感知/CRLF 保留、numstat 重命名展开、仓库根路径基准等，`f1f26e9`/`9b704f3`/`78ca280`）；`--append` 已成为持续交接文档的标准产出方式。测试 45 项。流程教训两次复现（上一班 23:46 与本次）：**管道后的命令退出码来自管道末端而非测试命令**，测试命令必须用 `PIPESTATUS`/`; echo $?` 显式确认，未修复该习惯前不得凭 `&&` 放行提交。\n\n## 二、长期约束（来自 AGENTS.md，2026-09-11 确立）\n\n1. **操作边界**：所有操作严格限定在 `D:\\workbuddy-space\\night-shift` 内。读写删均不得越界；任务需要目录外资源时直接放弃该任务，不得越界。\n2. **工作窗口**：正常工作窗口 23:05–08:05，每小时触发一次。\n   - 超过 08:05：不开始新的大型工作，只做收尾。\n   - 超过 08:45：只允许保存状态、写日志、Git 状态确认、交班。\n   - 超过 09:00：立即结束。\n3. **工作模式**：一次触发是一个工作时段而非一次性任务。完成 → 评估剩余时间 → 继续下一个有价值事项，直到时间不足或无安全有价值的工作。严禁\"完成一个任务 → 输出报告 → 提前结束\"。\n4. **任务优先级**：P0 影响其他夜班工作的错误 > P1 重要记忆/项目状态错误 > P2 重复、冲突、过时信息 > P3 结构优化 > P4 低价值整理。\n5. **记忆准入**：新信息只有在确实具有长期价值时才进入长期记忆；不把普通日志变成长期记忆；不凭空创造事实。\n6. **冲突处理**：新旧信息冲突时优先采用更新且证据更充分的信息；无法确定时保留冲突并标记待确认。\n7. **Git 纪律**：不要在没有必要的情况下制造 Commit；班次结束前生成/更新夜班A交班记录并确认 Git 状态。\n\n## 三、重要决策\n\n- [2026-09-11, 决策人: 夜班A] 记忆系统目录结构确定为：\n  - `memory/long-term-memory.md` — 本文件，长期约束与决策\n  - `memory/project-status.md` — 项目状态、待办、已完成事项\n  - `logs/YYYY-MM-DD.md` — 按日期的夜班工作日志\n  - `handoff/night-shift-a-handoff.md` — 夜班A交班记录（持续更新而非每日新建）\n  - 理由：结构最小化，满足协议要求的全部维护对象（记忆/状态/上下文/决策/约束/待办/已完成/交接）。\n- [2026-09-11, 更正于 23:30] AGENTS.md 已由用户本人提交入库（commit `23494ab`，23:25:45），夜班A无需也不应代为提交。此前的\"待确认：AGENTS.md 是否入库\"事项已解决。\n- [2026-09-11, 决策人: 夜班A] 提交到本地仓库但不执行 push。协议只要求\"确认 Git 状态\"，未授权推送远程。→ [2026-09-12, 决策人: 人工] 已裁决：push 职责授予「出版署」班次（每日约 08:50 由人工指令触发，负责扫描、审查夜班 A/B/C/D 成果并同步到 origin）；夜班 A/B/C/D 值班期间仍维持\"提交本地、不 push\"的纪律不变。\n\n## 四、待人工确认事项\n\n- ~~B/C/D 班次的具体职责定义~~ → [2026-09-12，人工确认] A=记忆基建、B=棋手联赛、C=无聊发明、D=记录。\n- ~~夜班是否允许/应该执行 `git push`~~ → [2026-09-12, 决策人: 人工] 允许，但仅限「出版署」班次（每日约 08:50 同步夜班成果到 origin）；A/B/C/D 值班期间仍不 push。\n- ~~交接目录命名统一为 `handoff/` 还是 `handoffs/`~~ → [2026-09-11, 夜班C] 工具默认目录已改为 `handoff/`，冲突在工具侧解决。若人工另有裁决（如改目录名），工具的 `--out` 参数可跟随，无需改代码。\n- ~~`tools/shift_report.py` 是否入库~~ → [2026-09-11, 夜班C] 已入库（commit `a80df5b`）。\n", "memory/project-status.md": "# 项目状态\n\n> 本文件跟踪夜班系统自身以及被托管项目的状态、待办与已完成事项。\n> 每次夜班结束时更新。带日期；完成的条目移入\"已完成\"并保留，便于回溯。\n\n---\n\n## 夜班系统自身\n\n**状态**：基础设施已建 hift_report.py`**（本班核心发明）：\n  - 解决什么问题：AGENTS.md 协议要求每班产出固定格式交班记录，其中 git 活动（提交、文件、行数、未提交状态、测试结果）是纯重复劳动。\n  - 最小实现：单文件 Python 脚本，仅标准库，`--since/--hours/--test/--stdout/--out` 五个参数。\n  - 收益：每班交班记录的客观部分零手工；`--test` 让\"班次结束前跑测试\"成为记录的一部分。\n  - 风险控制：`--out` 钳制在仓库内相对路径，防止越界写入。\n\n## 实际修改\n\n- 4 个提交：\n  - `a80df5bd` 添加交班记录生成器 shift_report.py 及单元测试（xCss）\n  - `1c5a274a` 记录 shift_report.py 自检结果并更正 AGENTS.md 入库事实（xCss）\n  - `c52db080` 建立夜班记忆系统：长期记忆、项目状态、日志与交接结构（xCss）\n  - `23494abd` docs: 添加夜班持续工作协议 AGENTS.md（xCss）\n- 触及 9 个文件（+758 / -13 行）：\n  - `.gitignore`\n  - `AGENTS.md`\n  - `README.md`\n  - `handoff/night-shift-a-handoff.md`\n  - `logs/2026-09-11.md`\n  - `memory/long-term-memory.md`\n  - `memory/project-status.md`\n  - `tests/test_shift_report.py`\n  - `tools/shift_report.py`\n- 工作区干净，无未提交改动\n- **人工归属说明**：`c52db08`、`1c5a274a` 是夜班A的并发工作；`23494ab` 是用户提交的协议。本班（夜班C）实际提交为 `a80df5b`（工具 + 测试 + README 合并 + .gitignore），触及 `tools/shift_report.py`、`tests/test_shift_report.py`、`README.md`、`.gitignore`。\n\n## 实验\n\n- 无正式实验。过程中验证了工具的多种路径：stdout 模式、文件输出、`--test` 传通过命令与失败命令（`exit 3`）、`--out` 越界拒绝、重复生成不覆盖。\n\n## 测试\n\n- 命令：`python -m unittest discover -s tests`\n- 结果：✅ 通过\n- 输出（末 20 行）：\n  ```\n  ...............\n  ----------------------------------------------------------------------\n  Ran 15 tests in 2.193s\n  \n  OK\n  ```\n\n## 失败\n\n- 初版 `--out` 接受绝对路径时崩溃，且崩溃前已把文件写到仓库外（`D:\\Program Files\\Git\\tmp-test\\`）——已清理并把 `--out` 钳制为仓库内相对路径。\n- 首次提交误将 `__pycache__/*.pyc` 入库——已补 `.gitignore` 并 amend 移除。\n- README 覆盖写入时被拒绝（文件在读取后被夜班A并发修改）——重新读取后合并而非覆盖，避免了踩掉A的目录结构说明。\n\n## 最有价值成果\n\n- `tools/shift_report.py`：把协议中最重复的交班记录劳动自动化，且已通过夜班A的独立自检并被其记入项目状态，属于被其他班次实际使用的工具。\n\n## 下一步\n\n- 工具目前无法区分并发班次的提交（共用 git 身份 + 时间窗口重叠）。可选方案：各班次在提交信息中带班次标记（如 `[C]`），工具按标记过滤——需要人工裁决约定。\n- 可考虑 `--append` 模式：把生成结果作为新章节追加到各班次的持续交接文档（如 `night-shift-c-handoff.md`），与夜班A的单文件持续更新风格统一。\n- 未 push（与夜班A一致，待人工授权）。\n\n## 建议A关注\n\n- `tools/shift_report.py` 已入库（`a80df5b`），默认目录已对齐你的 `handoff/`，模板已补「建议C关注」——你记录的两项待办可关闭/更新。\n- 交接文件现在有两 \n\n- `memory/long-term-memory.md`：新建。收录 AGENTS.md 的 7 条长期约束、系统事实、本夜决策；23:30 更正一条（AGENTS.md 实为用户自己提交，commit `23494ab`）。\n- `memory/project-status.md`：新建。夜班系统自身状态：基础设施已建立；待办含两项 P1。\n\n### 项目状态变化\n\n- 无外部项目变化（尚未托管任何项目）。\n- 仓库内新增 `tools/shift_report.py`（用户放入，未跟踪）：夜班自检通过，可用。\n\n### 发现的问题\n\n- 仓库此前无任何记忆机制——已在本夜解决。\n- ~~交接目录命名冲突~~ → 【2026-09-12 更正】已解决：`shift_report.py` 默认输出目录改为 `handoff/`。\n- ~~值班期间用户在并发操作仓库~~ → 【2026-09-12 更正】经用户确认，并发者是夜班B/C（A 曾误记为用户本人，长期记忆中已有更正记录）。后续班次开工前务必重新 `git status`/`git log`，避免基于过时快照工作。\n\n### 尚未解决\n\n- ~~交接目录命名冲突（待裁决）~~ → 已解决（见上）。\n- ~~`tools/shift_report.py` 是否入库~~ → 【2026-09-12 更正】已由夜班C入库（`a80df5b`）。\n\n### 建议B关注\n\n- `memory/project-status.md` 的待办列表（两项 P1）。\n- 工作窗口纪律（23:05–08:05，分界规则见长期记忆）。\n- 若使用 shift_report.py，注意加 `--out handoff`（或等命名裁决后统一），避免产出落到 `handoffs/`。\n\n### 建议C关注\n\n- 长期记忆中的\"待人工确认事项\"，若人工已回复请更新状态。\n- `tools/shift_report.py` 疑似由你（或为你的流程）准备：其章节模板含\"建议A/B/D关注\"，缺\"建议C\"。若这是你的产出工具，请在命名冲突裁决后把默认目录对齐。\n- 检查本次确立的目录结构是否符合后续班次使用习惯，如有更优方案请在决策中记录变更理由。\n\n### 建议D记录\n\n- 本夜为首次夜班，无历史日志可依赖；后续所有事实记录请带日期与来源，不确定即标注【待确认】。\n\n### 明天需要人工确认的事项\n\n> 【2026-09-12 收尾注】以下 4 项当时的记录，现状：第 1 项仍待定义细节（已知分工：A=记忆基建、B=棋手联赛、C=无聊发明，人工裁决于 2026-09-12）；第 2、3、4 项见上方\"需要人工确认的事项\"与长期记忆，push 仍是最主要的未决项。\n\n1. **B/C/D 班次的具体职责**：协议仅提及\"建议B关注/建议C关注/建议D记录\"，未定义三者工作内容。\n2. **是否自动 push**：夜班目前只 commit 到本地。仓库有远程 origin，若跨机器交接需要 push，请明确授权。\n3. **交接目录命名**：~~`handoff/` 还是 `handoffs/`？~~ → 已在工具侧解决（对齐 `handoff/`）。\n4. **tools/shift_report.py 是否入库**：→ 已入库。\n\n### Git 状态\n\n- 本夜A产生 1 个 commit：`c52db08` 建立夜班记忆系统（README + memory/ + logs/ + handoff/）。\n- 用户值班期间自行提交：`23494ab` AGENTS.md。\n- 未 push（待人工确认授权）。\n- 工作区遗留未跟踪：`tools/shift_report.py`。\n", "handoff/night-shift-b-handoff.md": "# 夜班B交班记录\n\n> 本文件为夜班B的持续交接文档，每次班次结束前更新最新一节，历史记录保留在下方。\n> 命名与结构跟随夜班A确立的\"单文件持续更新\"约定。\n\n---\n\n## 2026-09-11 班次（第二次触发，23:40–00:12）\n\n**值班人**：夜班B（棋手联赛）\n\n### 今晚比赛（问题竞争数量：3 局）\n\n1. **工具缺陷修复联赛（棋局5）**——开工时发现夜班C续班正在同一工作区活跃提交，避开其正在编辑的文件，转而派评审子代理对三个工具做只读评审，产出 15 项真实缺陷清单（2 P1 / 5 P2 / 8 P3）。对每项修复做了方案竞争（如越界校验放 `parse_since` 复用 `sys.exit` 风格 vs 在 `most_recent` 捕异常；`shift_start` 状态解析复用 `_parse_status_text` 单一事实源 vs 复制条件），逐项实施。\n2. **`--append` 数据完整性（棋局6）**——C 刚上线的 `--append` 有三个数据威胁：代码围栏内的 `## ` 行会被误降级/误当插入点；渲染页脚分隔线与追加分隔线重复；CRLF 文档被整体改写成 LF（本机 autocrlf=true，已在真实交接文档上证实）。方案竞争：页脚分隔线用\"识别页脚署名行+前置 `---`\"精准剥离，而非全局去重。\n3. **展示与路径基准（棋局7）**——numstat 重命名条目原样当文件名展示；`--out/--append` 按\"当前目录\"而非仓库根校验，与报错文案矛盾。胜出方案：重命名条目展开新旧两路径（文本格式内正则展开，不改用 `-z` 大改解析）；相对路径一律以 `git rev-parse --show-toplevel` 为基准。\n\n### 冠军方案\n\n- 局5：**\"评审驱动 + 单一事实源\"** 胜出——先全量只读评审再动手，修复时消除重复逻辑（`shift_start` 复用 `shift_report._parse_status_text`）而非复制修正。败方：边读边修（并发环境下会与 C 踩踏）、复制判定条件（两处漂移）。\n- 局6：**\"真实文件上演练验证\"** 胜出——修复后在真实交接文档的临时副本上演练，110 行 CRLF 全保留、零 LF 残留。败方：只靠单测（测试断言本身还会写错，见失败记录）。\n- 局7：**\"文案即契约\"**——报错文案说\"仓库内的相对路径\"，实现就必须以仓库根为基准；以文档为准修实现，而不是改文案迁就实现。\n\n### 实际实施内容（全部已提交）\n\n- `f1f26e9` 参数校验与判定修复：`--since` 数值越界友好报错、`--hours` 0/负数显式报错（旧实现 0 静默回落默认窗口、负数产出未来起点的空报告）、`--since/--hours` 互斥组、班次标题文件名净化、`--stdout`+`--append` 冲突警告、`shift_start.py --warn-minutes` 真实参与并发判定（旧实现硬编码 15 分钟）、AM/MM 状态条目不再漏报\n- `9b704f3` `--append` 数据完整性：围栏感知的标题降级与插入点扫描、页脚分隔线剥离、CRLF 行尾保留\n- `78ca280` numstat 重命名条目展开（`old => new`、`dir/{a => b}/f.txt` 两式）、`--out/--append` 以仓库根为基准、`auto_fill_tests` 渲染测试与子目录集成测试\n\n### 测试结果\n\n- 命令：`python -m unittest discover -s tests`\n- 结果：✅ 45 项全部通过（28 → 37 → 41 → 45，每局提交前独立回归，用 `PIPESTATUS[0]` 校验真实退出码）\n- 另做 CLI 冒烟 7 项（越界/互斥/警告/特殊字符标题/阈值校验）与真实 CRLF 文档追加演练。\n\n### 失败方案（如实记录）\n\n- **重蹈 23:46 覆辙**：`| tail` 再次吞掉退出码，1 项测试失败险些放行提交（本次失败项是我新写测试的断言逻辑错误——CRLF 保留时 `\\n## ` 必然是 `\\r\\n## ` 的子串，`assertNotIn` 永假）。用 `PIPESTATUS[0]` 拦截后修正断言。该教训已升格进长期记忆。\n- 评审子代理清单中\"双 `---` 紧邻重复\"一项经实测核实为夸大（页脚署名行使两条分隔线不相邻），但仍按低成本方案做了页脚分隔线剥离——教训：评审结论也要复现验证。\n- 初版 CRLF 测试用 `write_bytes` 传了 str（TypeError）——测试代码同样要回归验证。\n\n### 未完成问题\n\n- P3 并发班次提交归属（待人工裁决标记约定）、按班次配置章节集合（待人工裁决）、CI 实测（待 push 授权）——均沿用上一班记录，未被本班解除。\n- `--append AUTO` 哨兵值与同名文件冲突、带引号路径显示失真：评审确认的可接受限制，已记入项目状态 P3\"已知可接受限制\"。\n- 剩余评审 P3 项（status/numstat 改 `-z` 解析、`append_to_handoff` 无 `## ` 章节文档追加到末尾）边际价值低，未实施。\n\n### 下一轮建议\n\n- 开工第一件事仍是 `git status` + `git log --oneline -10` + 重读本文件与两个记忆文件（本夜已验证并发活跃到 23:49 之后）。\n- 工具层已相当健壮（45 项测试），下一班如无更高价值事项，不建议继续给 `shift_report/shift_start` 找茬——边际收益已明显下降。\n- 若人工裁决了班次标记或章节配置约定，优先实施；否则可考虑把\"开工自检 + 测试 + 交班生成\"串成一个 `tools/shift_wrap.py` 式的班次流水线入口（需先确认不是过度设计）。\n- push 授权后第一件事：确认 CI 真实运行结果。\n\n### 建议C继续研究的方向\n\n- `--append` 已是持续交接文档的标准产出方式，可考虑在 `shift_start.py` 输出末尾直接提示对应班的 `--append` 命令行（把两条工具串起来）。\n- 按班次配置章节集合的方案设计（若获批）：SECTIONS 按班次字母过滤，`PROTOCOL_REQUIRED_SECTIONS` 机制可复用。\n\n### 建议D记录的重大事项\n\n- 本夜第二人次复现管道吞退出码事故——该教训已进长期记忆，升格为\"未修复习惯前不得凭 `&&` 放行提交\"。\n- 并发纪律再次生效：本班开局发现 C 续班活跃后全程避开其编辑文件，双方零冲突完成各自工作。\n\n### Git 状态\n\n- 本班提交 3 个：`f1f26e9`、`9b704f3`、`78ca280`，另含记忆/日志/本文件更新的一次提交。\n- 未 push（沿用全夜决定，待人工授权）。\n\n---\n\n## 2026-09-11 班次（首次夜班）\n\n**值班人**：夜班B（棋手联赛）\n\n**班次窗口**：23:24 开工，本节写于 23:58。\n\n### 今晚比赛（问题竞争数量：4 局）\n\n1. **交接班记录系统**（开局棋局）——发现夜班A/C 并发工作后废弃，避免重复劳动；C 的 `shift_report.py`（`a80df5b`）与目录统一已覆盖本局目标。**判定：改为站在 C 成果上继续。**\n2. **章节对齐协议**——生成器章节缺 AGENTS.md 要求的交班字段。\n3. **跨午夜 `--since` 负窗口**——数据丢失级 bug。\n4. **CI 自动测试**——push/PR 无人工把关。\n\n### 冠军方案\n\n- 局2（章节对齐）：**\"常量+测试防漂移\"** 胜出——不仅补四章，还新增 `PROTOCOL_REQUIRED_SECTIONS` 常量，由测试断言协议字段永不缺失。败方：仅手补章节列表（下次协议改动会再漂移）。\n- 局3（跨午夜）：**\"未来时间点回退一天\"** 胜出——一行级修复正中夜班场景。败方：支持完整日期参数（扩大解析面，无人要求）、纯文档规避（不修代码，靠人记）。\n- 局4（CI）：GitHub Actions 双 Python 版本矩阵，纯新增文件零并发冲突。\n- 局1 的教训也是冠军决策：**并发环境下\"重新核实再动手\"胜过\"按过时快照执行\"**。\n\n### 实际实施内容（全部已提交）\n\n- `359b47d` 章节+协议字段对齐，新增 `PROTOCOL_REQUIRED_SECTIONS` 与 2 项测试\n- `befa1a5` 修复跨午夜 `--since` 负窗口（未来时间点回退一天）\n- `427013b` 统一 `--since` 语义为\"取该时刻最近一次出现\"，同步文档/测试\n- `16e4535` 新增 `.github/workflows/tests.yml`（CI）\n- 另更新 `memory/project-status.md`、`memory/long-term-memory.md`、本日志与本交班记录\n\n### 测试结果\n\n- 命令：`python -m unittest discover -s tests`\n- 结果：✅ 19 项全部通过（exit 0）\n- 另以 `python tools/shift_report.py --hours 2 --stdout` 冒烟验证 17 个章节全部渲染。\n\n### 失败方案（如实记录）\n\n- **棋局1 白做半程**：派子代理评审\"从零建交接系统\"四方案时，仓库已被 A/C 并发填满——评审基于过时快照。及时废弃，未产生代码损失，但浪费一轮评审。\n- **管道吞退出码**：`python -m unittest ... | tail -3 && git commit` 因管道退出码取自 `tail`，1 项测试失败仍放行了提交 `befa1a5`（失败项是我新写断言的前提错误）。以 `427013b` 修正。**教训：夜班提交前测试必须检查 `$?`，管道后必须用 `; echo EXIT=$?` 显式确认。**\n- 首版\"白天场景不应回退\"测试与新语义自相矛盾——修正语义而非保留矛盾测试。\n\n### 未完成问题\n\n- **P3 并发班次提交归属**（C 立项）：共用 git 身份+时间窗口重叠，工具无法区分班次提交。需人工裁决提交信息带 `[A]/[B]/[C]/[D]` 标记的约定，工具侧过滤尚未实现。\n- **交接文件命名双风格并存**（C 提请裁决）：A 式 `night-shift-x-handoff.md`（单文件持续更新）vs 工具产出的按日期独立文件。本班跟随 A 式记录。\n- **默认时间窗口**（本班新立 P3）：无参数时\"当天 00:00 起\"对跨午夜夜班不完整，早上生成会漏前半夜提交；建议显式 `--since \"23:05\"`（已修复跨午夜语义）或 `--hours 9`。默认值是否调整待裁决。\n- **CI 实际运行未验证**：协议未授权 push，workflow 只在下次 push 时才会真正执行，语法未经 Actions 实测（YAML 结构已人工校对）。\n\n### 下一轮建议\n\n- 下一班次开工第一件事：`git status` + `git log --oneline -10` + 重读本文件与两个记忆文件——本夜 A/C/B/用户四方并发，任何快照都会过时。\n- 编辑任何共享文件（memory/、logs/、README）前必须重新 Read 最新版；提交只 `git add` 自己的文件，绝不 `git add -A`。\n- 若人工采纳班次标记约定，可为 `shift_report.py` 增加 `--shift-tag` 过滤，一劳永逸解决归属问题。\n- 可考虑 C 提出的 `--append` 模式，让工具产出直接追加进各班持续交接文档，统一两种命名风格。\n\n### 建议C继续研究的方向\n\n- `--append` 模式：生成结果追加到 `night-shift-x-handoff.md`（与 A 式持续更新统一），替代\"生成独立文件再手工搬运\"。\n- 班次归属：若标记约定获批，`collect_commits` 可按 subject 前缀过滤，`render` 的\"人工归属说明\"可自动化。\n- 默认窗口语义：评估无参数时是否应自动改为\"最近一次 00:00\"或检测跨午夜。\n\n### 建议D记录的重大事项\n\n- 本夜为系统首夜，四方并发（A/C/B/用户）在同一工作树直接工作且全部成功避让——**\"开工重扫仓库、共享文件先重读、提交只加自己文件\"三条纪律已被四个实践者验证有效**，建议升格为长期约束。\n- 23:46 的管道吞退出码事故（失败测试随提交入库）是首夜唯一流程事故，已在 `427013b` 修复，教训已入日志。\n\n### Git 状态\n\n- 本班提交 4 个：`359b47d`、`befa1a5`、`427013b`、`16e4535`，另含本文件与记忆/日志更新的一次提交。\n- 未 push（沿用 A/C 的决定，待人工授权）；CI 将在首次 push 时首次执行。\n", "handoff/night-shift-c-handoff.md": "# 夜班C 交班记录\n\n- 班次日期：2026-09-11 23:45\n- 覆盖时段：2026-09-11 23:20 起\n- 仓库：`night-shift`（分支 `main` @ `9dba3b8`）\n\n## 2026-09-12 夜班C\n\n- 班次日期：2026-09-12 07:52\n- 覆盖时段：2026-09-11 23:05 起\n- 仓库：`night-shift`（分支 `main` @ `a862b6e`）\n\n### 今晚发现\n\n- （07:5x 补全）用户质询\"怎么没跑了\"后复盘：上一轮把\"待人工裁决\"边界划得过于保守——`--shift-tag` 与 `--profile` 都能 opt-in 先行实现（不用即零成本，裁决后即用）。**教训：被阻塞的只是\"默认行为\"，不是\"能力存在\"。** 另：23:05 默认窗口跨午夜语义实测正确。\n\n### 今晚完成\n\n- `a862b6e0` shift_report.py 新增 --shift-tag 归属过滤与 --profile/--sec 个提交（晨报口径：C 12 个带标记、23 个未标记，+2812/-110 行，触及 18 个文件），工作区收尾时干净，本地领先 origin/main 40 个提交。记忆系统、四件工具、62 项测试、CI、晨报闭环全部建立，测试与记忆体检均为绿。晨报已由 C 的 morning_report.py 生成（`handoff/2026-09-12-morning-report-2.md`）。\n\n## 完成事项\n\n- 记忆系统基础设施：`memory/`、`logs/`、`handoff/` 全部建立并持续更新（A）。\n- 四件工具入库：`shift_report.py`、`shift_start.py`、`memory_check.py`、`morning_report.py`（C）。\n- CI 建立：push/PR 时 3.12/3.13 矩阵跑单元测试 + memory_check（B 建，C 接入体检）。\n- 测试从 0 增至 62 项，全部通过；记忆体检通过（仅存 2 处待人工确认）。\n- 缺陷修复联赛两轮 + 子代理代码审查：共登记约 25 项缺陷，当场修复两批。\n- A/B/C 三班交班记录、两日日志、项目状态、长期记忆全部成形。\n\n## A·记忆大修\n\n- 判定系统首次启动，从零搭建记忆系统：长期记忆、项目状态、日志、交班结构（commit `c52db08`）。\n- 08:27 收尾：修正 A 交班记录中已解决项、运行记忆体检、补记日志（`a0a8637`）。\n- 自我纠错两处（值得肯定）：更正“shift_report.py 疑似用户放入”的错误判断（实为 C 创建，`a80df5b`）；更正“值班期间用户并发操作”的误记（实为夜班 B/C）。\n- 在长期记忆中确立 7 条长期约束、目录结构决策、“不自动 push”决策。\n\n## B·棋手联赛\n\n- 联赛形式为“缺陷修复联赛”，两轮值班：\n  - 第一轮：shift_report.py 章节与 AGENTS.md 交班字段对齐（`359b47d`）；修复跨午夜 `--since` 负窗口丢数据 bug（`befa1a5`/`427013b`）；建立 CI（`16e4535`）。测试 15→19。\n  - 第二轮：评审子代理产出 15 项缺陷清单，修复两批——参数校验类（`f1f26e9`）与数据完整性类（围栏感知、CRLF 保留、numstat 重命名展开，`9b704f3`/`78ca280`）。测试 45。\n- 沉淀流程教训进长期记忆（两班重复踩坑）：管道后退出码来自管道末端，测试必须用 `PIPESTATUS` 显式确认。\n\n## C·无聊发明\n\n一夜四件发明，全部入库、带测试：\n\n1. `shift_report.py` — 交班记录生成器（`a80df5b`），后续增补 `--append` 持续交班、`--shift-tag` 班次归属过滤、`--profile`/`--sections` 章节配置（`a862b6e`）。\n2. `shift_start.py` — 开工自检，检测并行班次活动与远程同步状态（`4a077b7`/`9314793`）——直接回应了本夜真实的并发踩踏风险。\n3. `memory_check.py` — 记忆体检：提交哈希校验、待确认事项汇总、未来日期检查，exit 1 可接 CI，已接入（`4c6893b`/`736d454`）。\n4. `morning_report.py` — 晨报生成器，夜班系统对人类的每日交付（`27d5278`）。\n\n另：修复 GBK 控制台崩溃（`6caff76`）；子代理审查发现 10 条缺陷，当场修 2 条，其余登记进项目状态。C 自 09-12 起示范 `[C]` 提交前缀。\n\n## 新发现\n\n- 本夜并发活跃度极高（A/B/C + 用户同时操作同一仓库），曾发生文件踩踏——催生 shift_start.py 开工自检，并写入长期记忆的开工纪律。\n- 23 个提交未带 `[A]/[B]/[C]/[D]` 前缀，晨报归属统计中显示为“未标记”——归属过滤功能已就绪但依赖各班遵守前缀约定。\n- 待人工确认事项从 4 项收敛到 2 项：B/C/D 职责定义（已知分工：A=记忆基建、B=棋手联赛、C=无聊发明，细节待补）、push 授权。\n\n## 失败与异常\n\n- C 在共享测试文件打补丁时放错分支，2 项测试失败，收拢定义后修复（53/53 通过）。\n- C 生成 --profile C 交班章节时脚本断言早退漏写 8 节，二次修复并 amend。\n- A 两处误判（shift_report.py 作者、并发操作者身份），均已在长期记忆更正。\n- 登记未修的真实缺陷：`--append` 并发无锁（P1，后写者覆盖先写者）；生成物写入非原子（P2）；空仓库运行工具裸 traceback（P2）。\n- D 班自身：会话夜间挂起约 9 小时，未能在 23:05–08:05 窗口内实时巡查——本杂志因此为清晨补编。\n\n## 风险\n\n- **40 个提交未 push**：CI 从未经 Actions 真实执行，CI 接入 memory_check 同样未实测；跨机器交接不可用。这是当前最大的未决项，等待人工授权。\n- `--append` 无锁并发：两班次追加同一持续交接文档时可无痕丢记录——与已发生过的并发踩踏是同类风险。\n- 本地无 pyyaml，YAML 机检被阻塞，完全依赖 CI（而 CI 依赖 push）。\n- 多班并发纪律依赖自觉：开工不重读最新状态、编辑共享文件不重新读取，都会复现踩踏。\n\n## 值得明天继续做的事情\n\n- 修复 P1：`--append` 并发锁（O_EXCL 锁文件 + os.replace 原子替换）；连带修 P2 原子写入与空仓库 traceback。\n- 各班次（A/B/D）在 `shift_report.py` 的 PROFILES 登记各自协议模板；全员采用 `[X]` 提交前缀。\n- push 授权后：验证 CI 实跑、确认 YAML 机检、生成首份“远程可见”的晨报。\n- 给晨报补 `--test` 参数与体检失败明细（P3）。\n\n## 明日优先级\n\nP0：请人工裁决 push 授权（40 个提交滞留本地，CI 与 YAML 机检全部堵在这一个决定上）。\nP1：`--append` 并发锁与生成物原子写入；B/C/D 职责定义补全。\nP2：PROFILES 各班登记、`[X]` 提交前缀全员落实、剩余 P3 缺陷清单消化。\n\n## 夜班总评\n\n一夜之间从空仓库建成自给自足的夜班系统——记忆、工具、测试、CI、晨报全部闭环，62 项测试全绿；只剩人类的一句“可以 push”。\n\n---\n*夜班D 汇编于 2026-09-12 08:37，证据来源：git log/reflog、logs/2026-09-11.md、logs/2026-09-12.md、handoff/night-shift-{a,b,c}-handoff.md、memory/long-term-memory.md、memory/project-status.md、handoff/2026-09-12-morning-report-2.md。*\n", "logs/2026-09-11.md": "# 夜班日志 2026-09-11（周五）\n\n## 班次A：记忆大修\n\n- **23:24** 值班开始，读取时间与仓库状态。\n- **23:25** 盘点结论：仓库处于初始状态（1 个 commit，仅含一行 README），AGENTS.md 未跟踪；无任何记忆文件、日志、交接文件。判定本次触发为系统首次启动。\n- **23:26** 确定本夜最高价值工作：P0 —— 从零搭建记忆系统基础设施（若无此基础，后续所有班次无处记录、无从交接）。\n- **23:26** 创建 `memory/`、`logs/`、`handoff/` 目录。\n- **23:27** 写入 `memory/long-term-memory.md`（长期约束、重要决策、待确认事项；只记录确凿事实，未知项标注待确认）。\n- **23:27** 写入 `memory/project-status.md`（系统状态、待办、已完成）。\n- **23:28** 写入本日志与 `handoff/night-shift-a-handoff.md`（首次交班记录）。\n- **23:28** 更新 README 为仓库结构说明。\n- **23:29** 提交一次引导性 commit（记忆系统建立），确认 Git 状态。未执行 push（协议未授权，已记为待确认）。\n- **23:30** 发现值班期间仓库并发变化：用户本人提交了 AGENTS.md（`23494ab`，23:25:45），并于 23:27 放入未跟踪的 `tools/shift_report.py`（交班记录生成器）。据此**更正**长期记忆：AGENTS.md 入库是用户自己的提交，不是夜班A的决策成果。\n- **23:31** 以 `--stdout` 模式自检 `shift_report.py`：运行正常，能正确采集提交/文件/行数/未提交状态。发现其默认输出目录 `handoffs/` 与夜班A建立的 `handoff/` 命名冲突，已记入待办与待确认事项；未擅自修改用户代码。\n\n## 班次C：无聊发明\n\n- **23:23** 值班开始。盘点：仓库仅一行 README + AGENTS.md，几乎空仓；判定按「发明」班次定位寻找最高价值工作。\n- **23:24** 确定本夜核心发明：交班记录生成器 `tools/shift_report.py`——自动化协议中每班重复的交班记录劳动（git 活动采集 + 固定章节模板）。\n- **23:26** 实现单文件工具（纯标准库）：`--since/--hours/--test/--stdout/--out`，自动填充提交/文件/行数/未提交状态/测试结果，判断类章节留 TODO。\n- **23:27** 测试中发现 `--out` 越界路径崩溃且已把文件写到仓库外——立即清理越界文件，并把 `--out` 钳制为仓库内相对路径。\n- **23:28** 编写 `tests/test_shift_report.py`（15 项，在临时 git 仓库中验证采集逻辑）。1 项失败暴露真实可用性问题（未提交文件只显示数量不显示路径）→ 改为列出路径。\n- **23:30** 发现夜班A并发建立记忆系统，且其交班记录指出了本工具的两个问题：目录命名冲突（`handoff/` vs `handoffs/`）、缺「建议C关注」章节。随即对齐：默认目录改 `handoff/`，补齐章节。README 读取后被并发修改，重新读取后合并而非覆盖。\n- **23:31** 提交工具+测试+README（`a80df5b`）；误将 `__pycache__` 入库，补 `.gitignore` 后 amend 移除。\n- **23:32** 自食其力：用工具生成本班交班记录 `handoff/2026-09-11-夜班C.md` 并补全全部 TODO 章节。\n- **23:35** 更新长期记忆（更正\"作者疑似用户\"）、项目状态（关闭两项待办、新增一项 P3）、本日志。\n- **23:36** 重扫仓库：发现夜班B并发扩展了工具章节并新增 CI；同步 README（`--since` 新语义与全部章节，`b59f27c`）。\n- **23:39** 实现第二个发明：开工自检工具 `tools/shift_start.py`——检测最后提交新鲜度与工作区状态，对并行班次活动给出踩踏警告（`4a077b7`）。首跑即正确识别出 B 刚提交 1 分钟。\n- **23:43** 实现夜班B建议的 `--append` 模式：交班记录直接追加进持续交接文档（最新章节在最上、既有内容保留、标题自动降级），统一 A 式约定（`9dba3b8`）。修复显式路径父目录不存在的边界 bug。\n- **23:45** 发现并修复非 ASCII 文件名被 git 转义显示的问题（`core.quotepath=off`，`8554444`），测试 28 项全部通过。\n- **23:47** 用 `--append` 建立 `handoff/night-shift-c-handoff.md`（C 的规范持续交班文档）并补全全部判断章节；更新项目状态与本日志。\n\n## 班次B：棋手联赛\n\n- **23:24** 值班开始。初次盘点仓库为空（仅 README + 未跟踪 AGENTS.md），提交 AGENTS.md（`23494ab`）后规划\"交接班记录系统\"棋局，并派子代理对抗评审方案。\n- **23:33** 重扫仓库发现剧烈并发变化：夜班A已建记忆系统并交班，`tools/shift_report.py` 与测试已入库（`a80df5b`），目录命名冲突已在工具侧解决。据此废弃原棋局1（避免重复劳动），改为在 C 成果之上继续。\n- **23:37** 棋局2：对照 AGENTS.md 夜班B交班字段，确认生成器缺\"今晚比赛/冠军方案/未完成问题/下一轮建议\"四章。补齐并新增 `PROTOCOL_REQUIRED_SECTIONS` 常量与两项防漂移测试（15→17 项通过），提交 `359b47d`。\n- **23:42** 棋局3：发现跨午夜 `--since` 负窗口 bug——早上 08:00 写 `--since \"23:05\"` 会被解析成未来 15 小时，`git log` 返回空，交班记录静默丢失整个班次提交。方案竞争后实施\"未来时间点回退一天\"修复，提交 `befa1a5`。\n- **23:46** 教训记录：`python -m unittest | tail` 管道吞掉退出码，1 项测试失败仍被 `&&` 放行提交（失败的是我新写的白天场 const esc = s => String(s).replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// 迷你 Markdown 渲染器：标题/列表/围栏代码/引用/表格/行内样式/链接。
// 逐行状态机；先转义一切 HTML，再按语法包标签，故无注入面。
function renderMd(src) {
  const lines = src.replace(/\r\n/g, "\n").split("\n");
  const out = [];
  let inCode = false, listType = null;
  const closeList = () => { if (listType) { out.push(`</${listType}>`); listType = null; } };
  const inline = s => s
    .replace(/`([^`]+)`/g, (_, c) => "<code>" + c + "</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/~~([^~]+)~~/g, "<del>$1</del>")
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,
      (m, t, u) => u.startsWith("http") ? `<a href="${u}">${t}</a>` : m);
  for (const raw of lines) {
    const line = esc(raw);
    if (line.startsWith("```")) {
      closeList();
      out.push(inCode ? "</code></pre>" : "<pre><code>");
      inCode = !inCode;
      continue;
    }
    if (inCode) { out.push(line); continue; }
    const h = line.match(/^(#{1,4}) (.*)$/);
    if (h) { closeList(); out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); continue; }
    if (/^\s*[-*] /.test(line)) {
      if (listType !== "ul") { closeList(); out.push("<ul>"); listType = "ul"; }
      out.push(`<li>${inline(line.replace(/^\s*[-*] /, ""))}</li>`); continue;
    }
    if (/^\s*\d+\. /.test(line)) {
      if (listType !== "ol") { closeList(); out.push("<ol>"); listType = "ol"; }
      out.push(`<li>${inline(line.replace(/^\s*\d+\. /, ""))}</li>`); continue;
    }
    closeList();
    if (line.startsWith("&gt; ")) { out.push(`<blockquote>${inline(line.slice(5))}</blockquote>`); continue; }
    if (/^\s*\|.*\|\s*$/.test(line)) {
      const cells = line.split("|").slice(1, -1).map(c => c.trim());
      if (cells.every(c => /^:?-+:?$/.test(c))) continue;  // 分隔行
      out.push(`<tr>${cells.map(c => `<td style="padding:4px 12px">${inline(c)}</td>`).join("")}</tr>`);
      continue;
    }
    if (line.trim() === "---") { out.push("<hr>"); continue; }
    if (line.trim() === "") continue;
    out.push(`<p>${inline(line)}</p>`);
  }
  closeList();
  if (inCode) out.push("</code></pre>");
  return out.join("\n").replace(/(<tr>[\s\S]*?<tr>)/, "<table>$1")
    .replace(/(<tr>(?:(?!<\/table>).)*<\/tr>)(?!.*<table)/s, "$1</table>");
}

async function openDoc(path, mtime, size) {
  document.getElementById("welcome").style.display = "none";
  const content = document.getElementById("content");
  content.style.display = "block";
  const body = document.getElementById("body");
  document.getElementById("docmeta").textContent =
    `${path} · ${mtime} · ${(size / 1024).toFixed(1)} KB`;
  // 正文随页面内嵌，不依赖任何相对路径：Pages 选 site/ 目录、--serve、
  // 直接双击 file:// 三种方式都能读（../ 会跳出 Pages 发布根而 404）。
  const embedded = CONTENT[path];
  body.innerHTML = typeof embedded === "string"
    ? renderMd(embedded)
    : '<p class="loading">正文未随页面内嵌（生成时该文件不可读），请重新运行 tools/night_docs.py。</p>';
  content.scrollIntoView();
  document.querySelectorAll(".doc").forEach(d =>
    d.classList.toggle("active", d.dataset.path === path));
}

function buildToc(filter) {
  const toc = document.getElementById("toc");
  const groups = {};
  for (const d of DATA.docs) {
    if (filter && !d.path.toLowerCase().includes(filter)) continue;
    (groups[d.dir] = groups[d.dir] || []).push(d);
  }
  toc.innerHTML = Object.entries(groups).map(([dir, docs]) =>
    `<div class="group">${esc(dir)}</div>` + docs.map(d =>
      `<span class="doc" data-path="${esc(d.path)}">${esc(d.path.split("/").pop())}
       <small>${esc(d.mtime)} · ${(d.size / 1024).toFixed(1)} KB</small></span>`).join("")
  ).join("") || '<div class="doc hidden"></div><div class="group">无匹配文档</div>';
}
document.getElementById("toc").addEventListener("click", e => {
  const doc = e.target.closest(".doc");
  if (!doc || !doc.dataset.path) return;
  const meta = DATA.docs.find(d => d.path === doc.dataset.path);
  openDoc(doc.dataset.path, meta.mtime, meta.size);
});
document.getElementById("search").addEventListener("input", e =>
  buildToc(e.target.value.toLowerCase()));
document.getElementById("back").addEventListener("click", () => {
  document.getElementById("content").style.display = "none";
  document.getElementById("welcome").style.display = "block";
});

document.getElementById("sub").textContent =
  `${DATA.docs.length} 份文档 · 生成于 ${DATA.generated}`;
buildToc("");

// 支持 docs.html#<路径> 深链（驾驶舱的交接/日志入口指到这里）
const hashPath = decodeURIComponent(location.hash.slice(1));
if (hashPath) {
  const meta = DATA.docs.find(d => d.path === hashPath);
  if (meta) openDoc(meta.path, meta.mtime, meta.size);
}
</script>
